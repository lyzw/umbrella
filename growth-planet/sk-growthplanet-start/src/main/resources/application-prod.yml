spring:
  datasource:
    url: jdbc:mysql://localhost:3306/growth_planet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Passw@rd1}
  data:
    redis:
      host: localhost
      port: 6379

# 微信真实凭证：appid/secret 经环境变量注入（wx.appid / wx.secret）。
# 客户端选择由 Spring profile 驱动——prod 激活 WxWechatClient（真实 code2session），dev/test 激活 MockWechatClient；
# 与 wx.mock 无关（该键为历史遗留死配置，已移除，请勿再加回）。
# 真实登录前置：须以 APP_PROFILE=prod 启动，且 deploy/config/application.yml 注入真实 JWT 密钥与已签核合规引用，
# 使 ProductionConfigGuard 通过（见 deploy/app/config/application.yml 注释）。

# 七牛对象存储：本地联调时通过环境变量注入真实凭证
# （QINIU_ACCESS_KEY / QINIU_SECRET_KEY / QINIU_BUCKET）；未注入时上传凭证接口降级 E-503，不影响启动。
# 其余字段（读取域名 / 上传入口 / 凭证有效期）继承 application.yml 的默认值。
qiniu:
  image-domain: image.studykid.cn

jwt:
  secret: synthetic-only-development-secret-01234567890123456789
  # 后台运营端独立密钥（与 C 端隔离）。
  admin-secret: synthetic-only-development-admin-secret-012345678901234

# 合成演示数据目录，不代表已获 Q-01 或正式字典审批。
compliance:
  collection-enabled: true
  self-attestation-accepted: true
  approval-reference: SYNTHETIC-DEMO-ONLY
  catalog-reference: SYNTHETIC-DEMO-ONLY
  agreement-text: "合成演示协议，仅用于测试 PROFILE 同意及撤回，不可采集真实儿童资料。"
  grades: [一年级, 二年级, 三年级, 四年级, 五年级, 六年级]
  allergens: [PEANUT, MILK, EGG]
  schools: [合成第一小学, 合成第二小学, 合成第三小学, 张江竹园中学]
