server:
  port: 19100

spring:
  application:
    name: growth-planet
  profiles:
    active: dev
  jackson:
    deserialization:
      accept-float-as-int: false
  # 本地占位数据源（dev/test 覆盖；test 由 @DynamicPropertySource 注入容器地址）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/growth_planet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
  # Sprint 1 不在应用启动时自动建表；生产/本地用 sql/sprint1_schema.sql 手动建表
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      # 全局逻辑删除：未删除=0；删除语句由业务以 setSql 注入 UNIX_TIMESTAMP()*1000（见各 Service）
      logic-delete-field: deleteAt
      logic-not-delete-value: 0
      logic-delete-value: UNIX_TIMESTAMP() * 1000
  mapper-locations: classpath*:mapper/*.xml

jwt:
  # 默认不提供密钥；dev/test 有合成演示覆盖值，prod 必须独立配置。
  secret: ${JWT_SECRET}
  access-ttl: 1800000
  issuer: growth-planet
  # 后台运营端独立账号体系密钥（与 C 端隔离）。
  admin-secret: ${JWT_ADMIN_SECRET}
  admin-access-ttl: 1800000
  admin-issuer: growth-planet-admin

wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}

# 七牛云对象存储（Kodo）：客户端直传，后端仅签发上传凭证，不接触文件字节。
# access-key / secret-key / bucket 三者「全空」= 未启用（上传接口降级 E-503，不阻断启动）；
# 「部分配置」= 误配，启动即失败（防止线上上传静默失效）。密钥请经环境变量注入，勿写入代码库。
qiniu:
  access-key: ${QINIU_ACCESS_KEY:}
  secret-key: ${QINIU_SECRET_KEY:}
  bucket: ${QINIU_BUCKET:}
  # 读取域名（图片/视频同域，以 img/ 与 video/ 路径前缀区分），代码归一为 https:// 前缀。
  image-domain: ${QINIU_IMAGE_DOMAIN:image.studykid.cn}
  # 上传入口；bucket 机房不同可覆盖（z1/z2/na0/as0 等）。
  upload-host: ${QINIU_UPLOAD_HOST:https://upload.qiniup.com}
  token-ttl-seconds: ${QINIU_TOKEN_TTL:3600}

# 后台运营端首个超级管理员引导配置（仅当 sys_admin_user 为空时播种，见 AdminDataInitializer）。
# 生产环境请通过环境变量覆盖默认密码，避免使用弱口令。
console:
  bootstrap:
    username: ${CONSOLE_BOOTSTRAP_USERNAME:admin.zhou}
    password: ${CONSOLE_BOOTSTRAP_PASSWORD:admin123}
    name: ${CONSOLE_BOOTSTRAP_NAME:超级管理员}

compliance:
  collection-enabled: false
  self-attestation-accepted: false
  # 若把 collection-enabled 改为 true，必须同时提供 grades / allergens / schools / approval-reference /
  # catalog-reference / agreement-text，否则启动即失败（ComplianceProperties#validateCatalogOnStartup），
  # 避免过敏原目录为空导致全体菜品 UNKNOWN、儿童端静默不可点菜。
