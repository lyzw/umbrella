spring:
  sql:
    init:
      mode: always
      schema-locations:
        # 测试库汇总建表脚本（sprint1~v007 迁移脚本按原顺序拼接，纯 DDL+勋章种子）。
        # 原 Navicat 整库 dump 保留于 sql/growth_planet_full_dump.sql，含业务数据，不用于测试。
        - classpath:growth_planet.sql
        # 后台运营端 4 张表 + 首个 SA 播种（v008，独立维护）
        - classpath:v008_admin.sql
  # datasource / redis 由 @ServiceConnection（Testcontainers）在集成测试中注入

logging:
  level:
    cn.studykid.growthplanet: INFO

jwt:
  secret: synthetic-only-test-secret-01234567890123456789012345
  admin-secret: synthetic-only-admin-secret-012345678901234567890123

# 七牛对象存储：测试专用合成凭证，仅用于断言上传凭证签发（HMAC 签名离线可算，不发真实网络请求）。
qiniu:
  access-key: synthetic-only-test-ak
  secret-key: synthetic-only-test-sk
  bucket: synthetic-only-test-bucket
  image-domain: image.studykid.cn

compliance:
  collection-enabled: true
  self-attestation-accepted: true
  approval-reference: SYNTHETIC-TEST-ONLY
  catalog-reference: SYNTHETIC-TEST-ONLY
  agreement-text: "合成测试协议，不适用于真实儿童数据。"
  grades: [一年级, 二年级, 三年级, 四年级, 五年级, 六年级]
  allergens: [PEANUT, MILK, EGG]
  # 必须包含「合成学校」：BaseIT 的共享档案与 CatalogFlowIT 的学校菜单用例都用该值，
  # 缺了会让所有依赖 readyProfile() 的集成测试整片 E400。
  schools: [合成学校, 合成第一小学, 合成第二小学]
