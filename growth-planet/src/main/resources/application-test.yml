spring:
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sprint1_schema.sql
        - classpath:sprint2_schema.sql
        - classpath:sprint3_catalog.sql
        - classpath:sprint3_confirmation.sql
        - classpath:sprint4_schema.sql
        - classpath:v002_chore_medal.sql
        - classpath:v002_schedule.sql
        - classpath:v003_wallet_board.sql
        - classpath:v002_family_dish.sql
        - classpath:v002_menu_dish_ref.sql
        - classpath:v004_health_check.sql
        - classpath:v005_child_want_eat.sql
        - classpath:v006_want_eat_medal.sql
  # datasource / redis 由 @ServiceConnection（Testcontainers）在集成测试中注入

logging:
  level:
    cn.studykid.growthplanet: INFO

jwt:
  secret: synthetic-only-test-secret-01234567890123456789012345

compliance:
  collection-enabled: true
  self-attestation-accepted: true
  approval-reference: SYNTHETIC-TEST-ONLY
  catalog-reference: SYNTHETIC-TEST-ONLY
  agreement-text: "合成测试协议，不适用于真实儿童数据。"
  grades: [一年级, 二年级, 三年级, 四年级, 五年级, 六年级]
  allergens: [PEANUT, MILK, EGG]
