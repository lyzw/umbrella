# -------------------------------------------------------------------
# 成长星球 · 预上线联调环境 · 外部覆盖配置
# 放在 jar 同目录的 config/ 下（/root/growth-planet/config/application.yml），
# Spring Boot 属性级覆盖 jar 内 application.yml，无需重新打包。
# 状态：预上线联调（小程序体验版）。Q-01 闸门以 TRIAL 编号放行；
#       正式上线前须替换为真实审批编号与经签核的正式协议。
# -------------------------------------------------------------------
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/growth_planet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # 由 start.sh 加载的 .env 注入（MYSQL_USER/MYSQL_PASSWORD）；
    # 默认 growthplanet = install 脚本建的独立应用账号，权限仅限 growth_planet 库
    username: ${MYSQL_USER:growthplanet}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

# 微信真实凭证：appid 取自小程序主体（体验版 wx.login 的 code 由它签发）；
# secret 经 .env 注入（WX_SECRET），从小程序后台「开发管理-开发设置」生成。
# 真实登录前置（重要）：须以 APP_PROFILE=prod 启动（start.sh 默认 dev，会用 MockWechatClient 走假登录，
# 即便下方真实凭证已配也不生效）。prod 下 WxWechatClient 才激活，且 ProductionConfigGuard 才会校验。
wx:
  appid: wx706ee9c8e9e830a3
  secret: ${WX_SECRET}

# JWT 真实密钥：prod 守卫要求独立、≥32 字节且非合成值（isDemonstration 命中 synthetic/test-secret/demo 即拒启）。
# 此覆盖配置须注入真实密钥（.env 的 JWT_SECRET / JWT_ADMIN_SECRET），否则会继承 jar 内 prod yml 的合成默认值，
# 导致 ProductionConfigGuard 在 prod 下拒绝启动。C 端与运营端密钥隔离。
jwt:
  secret: ${JWT_SECRET}
  admin-secret: ${JWT_ADMIN_SECRET}

# -------------------------------------------------------------------
# Q-01 合规闸门 · 预上线联调放行值（TRIAL 编号不含禁用字样，守卫可过）。
# 覆盖范围：真实登录 / 档案保存 / 家庭操作 / 通知资格等全部 requireCollection 检查点。
# 正式上线前替换：approval-reference / catalog-reference 换真实签核编号；
# agreement-text 换经法务/负责人签核的正式协议。
# -------------------------------------------------------------------
compliance:
  collection-enabled: true
  self-attestation-accepted: true
  approval-reference: GP-TRIAL-APPROVAL-2026-001
  catalog-reference: GP-TRIAL-CATALOG-2026-001
  agreement-version: v1
  agreement-text: "成长星球儿童个人信息保护规则（预上线联调版）：1. 本产品在预上线联调阶段仅收集实现注册登录与产品功能所必需的最小化信息，包括微信登录标识（openid/unionid）以及家长主动填写的儿童昵称、年级、学校、过敏与饮食偏好；2. 上述信息仅用于提供选餐、家务、勋章、日程与健康打卡等产品功能，不用于对外提供、广告或商业营销；3. 家长可随时在小程序内查阅、更正儿童信息，并可申请导出或删除，也可联系客服注销账号；4. 我们对儿童个人信息实行加密传输与访问隔离，联调阶段产生的数据在正式上线前将被清除或经家长确认后迁移；5. 如对本规则有疑问，可通过小程序内客服渠道联系我们。"
  grades: [一年级, 二年级, 三年级, 四年级, 五年级, 六年级]
  allergens: [PEANUT, MILK, EGG]
  # 学校发布目录（归属键）：须与小程序端 miniprogram/config.js 的 schools 完全一致，
  # 否则该校孩子看不到学校菜单。正式上线替换为真实学校名单（两端同步）。
  schools: [联调第一小学, 联调第二小学, 张江竹园中学]
