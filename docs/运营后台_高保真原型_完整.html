<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成长星球 · 运营后台 高保真原型（完整版 M0–M10）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--brand:#2f6df6;--brand2:#5b8def;--ink:#1f2933;--sub:#6b7785;--line:#e6ebf2;--bg:#f5f7fa;--soft:#eef3ff;--green:#3aa675;--red:#e5534b;--amber:#f5a623;--purple:#8b5cf6}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
  /* ============ 登录门户 ============ */
  #login{position:fixed;inset:0;background:linear-gradient(135deg,#0f1f3d,#1d335f);display:flex;align-items:center;justify-content:center;z-index:50}
  #login .box{width:380px;background:#fff;border-radius:16px;padding:34px 32px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  #login .lg-logo{font-size:20px;font-weight:800;color:#11203f;display:flex;align-items:center;gap:10px}
  #login .lg-logo span{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f6df6,#5b8def);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
  #login .lg-sub{font-size:12px;color:var(--sub);margin:6px 0 22px}
  #login .field{margin-bottom:14px}
  #login .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
  #login .field input,#login .field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:14px}
  #login .btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:9px;padding:12px;font-size:15px;cursor:pointer;margin-top:6px}
  #login .cap{font-size:11px;color:var(--sub);background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:16px;line-height:1.6}
  #login .err{display:none;color:var(--red);font-size:12px;margin-top:8px}
  /* ============ 外壳 ============ */
  .app{display:none;height:100vh}
  .app.on{display:flex}
  .side{width:216px;background:#11203f;color:#cdd8ee;display:flex;flex-direction:column;flex-shrink:0}
  .side .logo{padding:18px 18px 14px;font-size:15px;font-weight:700;color:#fff;border-bottom:1px solid #20335c}
  .side .logo small{display:block;font-size:11px;color:#7f93bd;font-weight:400;margin-top:2px}
  .side nav{flex:1;overflow-y:auto;padding:8px 0}
  .side nav .grp{font-size:11px;color:#6c80ab;padding:12px 18px 4px}
  .side nav a{display:flex;align-items:center;gap:9px;padding:9px 18px;color:#cdd8ee;text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
  .side nav a:hover{background:#18294d;color:#fff}
  .side nav a.active{background:#1d335f;border-left-color:var(--brand2);color:#fff}
  .side nav a .dot{width:6px;height:6px;border-radius:50%;background:#42577f}
  .side nav a.active .dot{background:var(--brand2)}
  .side .me{padding:12px 18px;border-top:1px solid #20335c;font-size:12px;color:#9fb0d4}
  .side .me b{color:#fff}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px}
  .topbar .crumb{font-size:13px;color:var(--sub)} .topbar .crumb b{color:var(--ink)}
  .topbar .search{flex:1;max-width:340px;margin-left:auto;position:relative}
  .topbar .search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 12px 7px 30px;font-size:13px;background:#fafbfd}
  .topbar .search::before{content:"⌕";position:absolute;left:10px;top:6px;color:#9aa7b8;font-size:15px}
  .topbar .rolesw{font-size:12px;color:var(--sub)}
  .topbar .rolesw select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;margin-left:6px}
  .topbar .bell{position:relative;font-size:17px;color:var(--sub);cursor:pointer}
  .topbar .bell .badge{position:absolute;top:-4px;right:-5px;background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:0 4px}
  .topbar .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2f6df6,#5b8def);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .content{flex:1;overflow-y:auto;padding:22px 26px}
  .page-h{display:flex;align-items:center;margin-bottom:6px}
  .page-h h1{font-size:19px}
  .page-h .btn{margin-left:auto}
  .desc{color:var(--sub);font-size:12.5px;margin-bottom:14px;line-height:1.6}
  .tabs{display:flex;gap:4px;margin:10px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs .t{padding:9px 15px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
  .tabs .t.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .panel{display:none} .panel.on{display:block}
  /* filter + table */
  .filter{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .filter input,.filter select{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;background:#fafbfd;color:var(--ink)}
  .filter .btn-ghost{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--sub)}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#f7f9fc;color:var(--sub);font-weight:600;font-size:12px}
  tbody tr:hover{background:#fafcff}
  .pill{display:inline-block;border-radius:6px;padding:2px 9px;font-size:11px;font-weight:600}
  .pill.sa{background:#11203f;color:#fff}.pill.op{background:var(--soft);color:var(--brand)}
  .pill.cr{background:#e7f6ee;color:var(--green)}.pill.dc{background:#fff3e0;color:#b9770e}
  .pill.cp{background:#fdeaef;color:#c0347d}.pill.ra{background:#eef1f5;color:#5a6b82}
  .pill.ok{background:#e7f6ee;color:var(--green)}.pill.warn{background:#fff3e0;color:#b9770e}
  .pill.bad{background:#fdeaef;color:var(--red)}.pill.info{background:var(--soft);color:var(--brand)}
  .st{font-size:12px}.st.on{color:var(--green)}.st.off{color:var(--red)}.st.pend{color:var(--amber)}
  .link{color:var(--brand);cursor:pointer;text-decoration:none;margin-right:10px;font-size:13px}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
  .btn:hover{background:#2560e0}
  .btn-line{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--sub)}
  .pager{display:flex;justify-content:flex-end;gap:6px;padding:12px 14px;color:var(--sub);font-size:12px;align-items:center}
  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .stat .l{font-size:12px;color:var(--sub)}
  .stat .v{font-size:25px;font-weight:800;margin:6px 0 2px}
  .stat .s{font-size:11px}
  .stat .s.up{color:var(--green)} .stat .s.down{color:var(--red)}
  /* drawer */
  .mask{position:fixed;inset:0;background:rgba(17,32,63,.35);display:none;z-index:20}
  .mask.on{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:.25s;z-index:21;display:flex;flex-direction:column}
  .drawer.on{transform:translateX(0)}
  .drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-size:15px;font-weight:600}
  .drawer .dh .x{margin-left:auto;cursor:pointer;color:var(--sub);font-size:18px}
  .drawer .db{padding:18px 20px;overflow-y:auto;flex:1}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit}
  .field textarea{resize:vertical;min-height:74px}
  .seg{display:flex;gap:8px}
  .seg label{border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;flex:1;text-align:center}
  .seg input{display:none}
  .drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .hint{font-size:11px;color:var(--sub);background:var(--soft);border-radius:8px;padding:9px 11px;margin-top:4px;line-height:1.6}
  .note{font-size:12px;color:#5a6b82;background:#f3f6fb;border-left:3px solid var(--brand);border-radius:6px;padding:10px 12px;margin:10px 0;line-height:1.6}
  /* role permission matrix */
  .rpm{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
  .rpm table{font-size:12.5px;min-width:760px}
  .rpm th,.rpm td{padding:9px 12px}
  .rpm .res{font-weight:600;color:var(--ink)}
  .chk{width:16px;height:16px;accent-color:var(--brand)}
  .rolebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .rolebar .rb{border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;background:#fff}
  .rolebar .rb.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tag-ind{font-size:11px;color:#9aa7b8;margin-left:6px}
  /* charts */
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
  .panelbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .panelbox h3{font-size:14px;margin-bottom:14px}
  .bar{display:flex;align-items:flex-end;gap:14px;height:180px;padding:0 6px}
  .bar .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bar .col .fill{width:100%;background:linear-gradient(180deg,#5b8def,#2f6df6);border-radius:6px 6px 0 0;min-height:4px}
  .bar .col .lab{font-size:11px;color:var(--sub);margin-top:6px}
  .bar .col .num{font-size:11px;color:var(--ink);font-weight:700;margin-bottom:3px}
  .donut{width:150px;height:150px;border-radius:50%;margin:6px auto 10px;background:conic-gradient(var(--brand) 0 42%,var(--green) 42% 70%,var(--amber) 70% 86%,#cdd8ee 86% 100%)}
  .legend{font-size:12px;color:var(--sub);line-height:1.9}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .list{list-style:none;font-size:13px}
  .list li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
  .list li .t{color:var(--ink)} .list li .m{color:var(--sub);font-size:12px}
  .todo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 16px}
  .todo .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .todo .row:last-child{border-bottom:none}
  .todo .pri{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px}
  .todo .pri.h{background:#fdeaef;color:var(--red)} .todo .pri.m{background:#fff3e0;color:#b9770e} .todo .pri.l{background:var(--soft);color:var(--brand)}
  .work-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
  .wcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
  .wcard:hover{border-color:var(--brand2)}
  .wcard .ic{font-size:22px}
  .wcard .ti{font-size:14px;font-weight:600;margin:8px 0 4px}
  .wcard .de{font-size:12px;color:var(--sub);line-height:1.5}
  .wcard .nu{font-size:20px;font-weight:800;color:var(--brand);margin-top:8px}
</style>
</head>
<body>

<!-- ============ 登录门户 ============ -->
<div id="login">
  <div class="box">
    <div class="lg-logo"><span>星</span>成长星球 · 运营后台</div>
    <div class="lg-sub">Growth Planet Admin Console</div>
    <div class="field"><label>登录账号</label><input id="lgUser" placeholder="如 admin.zhou（独立后台账号）"></div>
    <div class="field"><label>密码</label><input id="lgPwd" type="password" placeholder="请输入密码"></div>
    <div class="field"><label>角色</label>
      <select id="lgRole"><option>超级管理员 SA</option><option>运营管理员 OP</option><option>内容审核员 CR</option><option>数据运营/客服 DC</option><option>合规/隐私专员 CP</option><option>只读审计员 RA</option></select>
    </div>
    <button class="btn" onclick="doLogin()">登 录</button>
    <div class="err" id="lgErr">账号或密码错误，请重试</div>
    <div class="cap">🔐 后台账号独立于小程序 C 端（usr_user），通过 sys_admin_user 鉴权，登录态与 token 隔离；全部操作记入 sys_audit_log。</div>
  </div>
</div>

<!-- ============ 应用外壳 ============ -->
<div class="app" id="app">
  <aside class="side">
    <div class="logo">成长星球 · 运营后台<small>Growth Planet Admin</small></div>
    <nav id="nav">
      <div class="grp">概览</div>
      <a data-view="workbench"><span class="dot"></span>工作台</a>
      <a data-view="dashboard"><span class="dot"></span>数据看板</a>
      <div class="grp">运营管理</div>
      <a data-view="users"><span class="dot"></span>用户与权限</a>
      <a data-view="content"><span class="dot"></span>内容管理</a>
      <a data-view="bizdata"><span class="dot"></span>业务数据管理</a>
      <a data-view="privacy"><span class="dot"></span>合规与隐私</a>
      <div class="grp">治理</div>
      <a data-view="audit"><span class="dot"></span>操作审计</a>
      <a data-view="notify"><span class="dot"></span>消息通知</a>
      <a data-view="monitor"><span class="dot"></span>监控告警</a>
      <a data-view="config"><span class="dot"></span>系统配置</a>
      <a data-view="help"><span class="dot"></span>帮助手册</a>
    </nav>
    <div class="me">当前角色：<b id="meRole">超级管理员(SA)</b><br>登录态与小程序账号隔离</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb" id="crumb">工作台 / <b id="crumbNow">首页</b></div>
      <div class="search"><input placeholder="全局搜索 家庭 / 孩子 / 工单 / 日志"></div>
      <div class="rolesw">视图角色
        <select id="roleSw" onchange="switchRole(this.value)">
          <option value="SA">超级管理员 SA</option><option value="OP">运营管理员 OP</option>
          <option value="CR">内容审核员 CR</option><option value="DC">数据客服 DC</option>
          <option value="CP">合规隐私 CP</option><option value="RA">只读审计 RA</option>
        </select>
      </div>
      <div class="bell">🔔<span class="badge" id="bellBadge">3</span></div>
      <div class="av">管</div>
    </div>
    <div class="content" id="content"><!-- 动态渲染 --></div>
  </main>
</div>

<!-- 抽屉 -->
<div class="mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dh"><span id="drawerTitle">标题</span><span class="x" onclick="closeDrawer()">×</span></div>
  <div class="db" id="drawerBody"></div>
  <div class="df" id="drawerFoot"></div>
</div>

<script>
/* ============ 通用渲染助手 ============ */
function table(headers, rows){
  let h='<thead><tr>'+headers.map(x=>`<th>${x}</th>`).join('')+'</tr></thead>';
  let b=rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
  return `<div class="card"><table>${h}${b}</table><div class="pager">共 ${rows.length} 条 · 第 1/1 页 <button class="btn-ghost">上一页</button><button class="btn-ghost">下一页</button></div></div>`;
}
function filterBar(fields){
  return `<div class="filter">`+fields.map(f=>{
    if(f.type==='select') return `<select><option>${f.ph}</option>${f.opts.map(o=>`<option>${o}</option>`).join('')}</select>`;
    return `<input style="width:${f.w||160}px" placeholder="${f.ph}">`;
  }).join('')+`<button class="btn-ghost">查询</button><button class="btn-ghost">重置</button></div>`;
}
function statCards(cards){
  return `<div class="stats">`+cards.map(c=>`<div class="stat"><div class="l">${c.l}</div><div class="v">${c.v}</div><div class="s ${c.t||''}">${c.s||''}</div></div>`).join('')+`</div>`;
}
function tabs(list){
  return `<div class="tabs">`+list.map((t,i)=>`<div class="t ${i===0?'on':''}" data-tab="${t.k}" onclick="switchTab('${t.k}')">${t.t}</div>`).join('')+`</div>`;
}
function panel(k, html, on){return `<div class="panel ${on?'on':''}" id="panel-${k}">${html}</div>`;}

/* ============ 视图注册表 ============ */
const VIEWS = {};

/* ---- M0 工作台 ---- */
VIEWS.workbench = function(){
  return `
  <div class="page-h"><h1>工作台</h1></div>
  <div class="desc">运营人员每日入口：待办、关键指标速览、快捷入口。所有指标与全量看板（M1）同源。</div>
  ${statCards([
    {l:'今日活跃家庭',v:'1,284',s:'↑ 6.2% 较昨日',t:'up'},
    {l:'待处理隐私工单',v:'3',s:'需 CP 闭环',t:''},
    {l:'待审核 UGC',v:'12',s:'需 CR 处置',t:''},
    {l:'今日告警',v:'2',s:'1 高危',t:'down'},
  ])}
  <div class="grid2">
    <div class="todo">
      <div class="row"><span class="pri h">高</span><div style="flex:1"><div class="t">隐私工单 #PV-2048 待核验导出</div><div class="m">钱合规 · 超时 1.2 天</div></div><span class="link" onclick="renderView('privacy')">去处理</span></div>
      <div class="row"><span class="pri h">高</span><div style="flex:1"><div class="t">UGC 图像命中高危词库 #UG-771</div><div class="m">赵审核 · 机审拦截待人审</div></div><span class="link" onclick="renderView('content')">去处理</span></div>
      <div class="row"><span class="pri m">中</span><div style="flex:1"><div class="t">确认单 #CF-3392 超额复核</div><div class="m">林运营提交 · 待 SA/CP 复核</div></div><span class="link" onclick="renderView('bizdata')">去处理</span></div>
      <div class="row"><span class="pri l">低</span><div style="flex:1"><div class="t">家庭 #F-10231 申诉待回复</div><div class="m">吴客服 · 2 小时前</div></div><span class="link">查看</span></div>
    </div>
    <div class="panelbox">
      <h3>近 7 日活跃家庭趋势</h3>
      <div class="bar">
        ${[820,910,870,1010,1180,1230,1284].map((v,i)=>{const hgt=Math.round(v/1284*150);return `<div class="col"><div class="num">${v}</div><div class="fill" style="height:${hgt}px"></div><div class="lab">${['一','二','三','四','五','六','日'][i]}</div></div>`;}).join('')}
      </div>
    </div>
  </div>
  <div class="work-grid">
    ${[['👥','用户与权限','账号/角色/RBAC 矩阵','users'],['🍱','内容管理','菜品/菜单/UGC 审核','content'],['📊','业务数据','家庭/确认单/钱包','bizdata'],['🔐','合规隐私','同意/隐私工单','privacy'],['🧾','操作审计','全量日志追溯','audit'],['⚙️','系统配置','枚举/参数/开关','config']].map(c=>`<div class="wcard" onclick="renderView('${c[3]}')"><div class="ic">${c[0]}</div><div class="ti">${c[1]}</div><div class="de">${c[2]}</div></div>`).join('')}
  </div>`;
};

/* ---- M1 数据看板 ---- */
VIEWS.dashboard = function(){
  return `
  <div class="page-h"><h1>数据看板</h1><button class="btn">导出报表（脱敏）</button></div>
  <div class="desc">运营总览与分域指标。口径见详细设计文档 §8；含明文导出需 CP 审批并记录审计（M6）。</div>

}

  const root=document.getElementById('content');

function selRole(r){
  document.querySelectorAll('#roleBar .rb').forEach(e=>e.classList.toggle('on',e.dataset.role===r));
  const tb=document.querySelector('#rpmTable tbody'); if(!tb) return; tb.innerHTML='';
  for(const res in perms){
    const p=perms[res]; let cells='<td class="res">'+res+'</td>';
    ops.forEach(o=>{const has=p[o]&&p[o].includes(r);
      cells+=`<td>${has?'<input type="checkbox" class="chk" checked '+(r==='SA'?'':'disabled')+'>':'<span style="color:#c4cdda">—</span>'}</td>`;});
    tb.innerHTML+=`<tr>${cells}</tr>`;
  }
}
function doLogin(){
  const u=document.getElementById('lgUser').value.trim();
  const p=document.getElementById('lgPwd').value;
  if(!u||!p){document.getElementById('lgErr').style.display='block';return;}
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  renderView('workbench');
}
function switchRole(v){
  const map={SA:'超级管理员(SA)',OP:'运营管理员(OP)',CR:'内容审核员(CR)',DC:'数据运营/客服(DC)',CP:'合规/隐私专员(CP)',RA:'只读审计员(RA)'};
  document.getElementById('meRole').textContent=map[v];
  const badge=v==='CP'?3:v==='CR'?12:v==='SA'?3:2;
  document.getElementById('bellBadge').textContent=badge;
}
