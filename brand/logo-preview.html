<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成长星球 Logo 预览</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:#222;background:#f5f7fa}
  h1{font-size:22px;margin:24px 24px 6px}
  p.sub{margin:0 24px 18px;color:#666}
  .row{display:flex;flex-wrap:wrap;gap:16px;padding:0 24px 8px}
  .card{border-radius:14px;padding:22px 18px;box-shadow:0 4px 16px rgba(0,0,0,.08);background:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:180px}
  .card.dark{background:#1f2733}
  .card img{width:170px;height:auto;display:block}
  .card .tag{font-size:13px;color:#888}
  .card.dark .tag{color:#9fb0c0}
  .swatches{display:flex;flex-wrap:wrap;gap:10px;padding:18px 24px 36px}
  .sw{width:104px;height:74px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-size:12px;padding-bottom:7px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
</style>
</head>
<body>
  <h1>成长星球 · Logo 视觉资产</h1>
  <p class="sub">卡通可爱风 · 绿蓝主色 · 含 App 图标 / 横版全称 / 竖版堆叠 三套（已附深底反白版）</p>
  <div class="row">
    <div class="card"><img src="logo-icon.svg" alt="App 图标"><span class="tag">App 图标（浅底）</span></div>
    <div class="card dark"><img src="logo-icon.svg" alt="App 图标反白" style="filter:brightness(0) invert(1)"><span class="tag">App 图标（深底反白）</span></div>
    <div class="card"><img src="logo-wordmark.svg" alt="横版全称"><span class="tag">横版全称（浅底）</span></div>
    <div class="card dark"><img src="logo-wordmark.svg" alt="横版全称反白" style="filter:brightness(0) invert(1)"><span class="tag">横版全称（深底反白）</span></div>
    <div class="card"><img src="logo-stacked.svg" alt="竖版堆叠"><span class="tag">竖版堆叠（浅底）</span></div>
    <div class="card dark"><img src="logo-stacked.svg" alt="竖版堆叠反白" style="filter:brightness(0) invert(1)"><span class="tag">竖版堆叠（深底反白）</span></div>
  </div>
  <div class="swatches">
    <div class="sw" style="background:#46B4EC">天空蓝 #46B4EC</div>
    <div class="sw" style="background:#5FC98E">薄荷绿 #5FC98E</div>
    <div class="sw" style="background:#43B258">嫩芽绿 #43B258</div>
    <div class="sw" style="background:#2E7D9A">品牌青 #2E7D9A</div>
    <div class="sw" style="background:#FFB3C4">腮红粉 #FFB3C4</div>
    <div class="sw" style="background:#FFE08A">星光黄 #FFE08A</div>
  </div>
</body>
</html>
