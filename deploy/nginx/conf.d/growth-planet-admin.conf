# 成长星球 · 运营后台前端（Vue3 SPA）
# 放置路径：/etc/nginx/conf.d/growth-planet-admin.conf
# 静态托管构建产物 dist/，并代理 /api 到后端（沿用 dev 的相对路径约定，避免 CORS）
#
# 部署步骤：
#   1. 将前端构建产物放到 root 指向的目录（默认 /var/www/growth-planet-admin/dist，按需修改）
#   2. 将真实证书放到 /etc/nginx/ssl/admin.studykid.cn.pem 与 .key（替换下方占位路径）
#   3. 把本文件复制到 /etc/nginx/conf.d/
#   4. nginx -t && systemctl reload nginx

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name admin.studykid.cn;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl;
    server_name admin.studykid.cn;

    ssl_certificate     /data/pks/admin.studykid.cn.pem;   # TODO: 替换为真实证书
    ssl_certificate_key /data/pks/admin.studykid.cn.key;   # TODO: 替换为真实私钥

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # SPA 构建产物目录（部署时按需调整）
    root /var/www/growth-planet-admin/dist;
    index index.html;

    # API 反向代理到后端（SPA 以相对 /api 调用，无需 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:19100;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # 带 hash 的静态资源长缓存（内容指纹变化即换名，可安全长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由回退：未命中静态文件一律交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
