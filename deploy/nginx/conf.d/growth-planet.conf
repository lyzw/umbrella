# 成长星球 · 后端 API 网关
# 放置路径：/etc/nginx/conf.d/growth-planet.conf
# 反向代理到 Spring Boot（默认 127.0.0.1:19100，见 application.yml 的 server.port）
# 统一接口前缀 /api：C 端 /api/mini/** 与运营端 /api/admin/** 同源
#
# 部署步骤：
#   1. 将真实证书放到 /etc/nginx/ssl/api.studykid.cn.pem 与 .key（替换下方占位路径）
#   2. 把本文件复制到 /etc/nginx/conf.d/
#   3. nginx -t && systemctl reload nginx

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name api.studykid.cn;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl;
    server_name api.studykid.cn;

    ssl_certificate     /data/pks/api.studykid.cn.pem;   # TODO: 替换为真实证书
    ssl_certificate_key /data/pks/api.studykid.cn.key;   # TODO: 替换为真实私钥

    # SSL 安全基线（可按合规要求调整）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 请求体上限：七牛为客户端直传，后端不接收文件字节；此处仅给 JSON / 导出任务留余量
    client_max_body_size 20m;

    # 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:19100;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # 健康检查：后端若暴露 /actuator/health 可启用；当前未配置则 404 无害
    location = /health {
        proxy_pass http://127.0.0.1:19100;
        proxy_set_header Host $host;
    }
}
